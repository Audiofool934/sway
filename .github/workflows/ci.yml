# The README's development checks, on every pull request and on main.
# MRT2's model is not in the repository, so the one test that needs it skips here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run. Each push to main has a group of its
# own, because a group keeps only its newest waiting run and drops any older one.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.7" # The development Mac's uv; change both together.
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/*.test.js
      - run: node_modules/.bin/prettier --check 'web/*.{js,css,html}' 'web/instrument/*.{js,css}'

  whitespace:
    name: Whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # For a pull request, HEAD is GitHub's merge commit, whose first parent is the base
      # branch; for a push to main, the base is main before the push. Either way, this
      # checks every line the change adds.
      - run: git diff --check "$BASE" HEAD
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^' || github.event.before }}
