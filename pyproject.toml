[project]
name = "sway-instrument"
version = "0.1.0"
description = "A generative instrument: music inspired by movement and visual context."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "numpy==2.5.3",
  "pillow==12.3.0",
  "soundfile==0.14.0",
  "huggingface-hub==1.33.0",
  "httpx==0.28.1",
  "mlx==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "ai-edge-litert==2.2.0",
  "sentencepiece==0.2.2",
  "mlx-vlm==0.6.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "websockets==17.1",
]

[project.scripts]
sway = "sway.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
